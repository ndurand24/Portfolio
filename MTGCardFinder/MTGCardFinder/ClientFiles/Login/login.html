<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
    <script src="https://ajax.aspnetcdn.com/ajax/jQuery/jquery-3.7.1.js"></script>
    <script src="login.js"></script>
</head>
    <link rel="icon" href="data:,">
<body>
    <!--Page Title/Header-->
    <header>
        <h1>MTG Card Finder/Deck Builder</h1>
    </header>

    <!--Main Page Contents-->
    <main>
        <!--Response from server goes here-->
        <p id="responseText"></p>

        <!--Username, password, and login button to login. Register button to redirect to register page-->
        <label for="">Username: <input type="text" placeholder="Enter username" name="username"></label>
        <br>
        <label for="">Password: <input type="password" placeholder="Enter password" name="password" ></label>
        <br>
        <button type="button" name="login">Login</button>
        <br>
        <button type="button" name="register">Register</button>
    </main>
    
    <!--Footer of page. Contains Author and last revision date-->
    <footer>
        <p>&copy Noah Durand</p>
        <script>
            document.write("Last Modified " + document.lastModified);
        </script>
    </footer>
</body>
</html>
